name: build-unsigned
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle testDebugUnitTest --console=plain
      - name: Render checks
        run: gradle recordRoborazziDebug --console=plain
      - name: Assemble (no ticket, no secrets)
        run: gradle assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: apk-and-renders
          retention-days: 3
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/roborazzi/*.png
            build/test-results/testDebugUnitTest/*.xml
